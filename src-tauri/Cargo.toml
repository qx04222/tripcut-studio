[package]
name = "tripcut-studio"
version = "0.11.5"
description = "旅剪工作台桌面应用"
authors = ["TripCut Studio"]
edition = "2021"

[lib]
name = "tripcut_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# R21 photo-core: macOS ImageIO + future photo similarity hashing.
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "CGImageDestination", "objc2-core-graphics"] }
image_hasher = "=3.0.0"
# 三者早已在依赖树里(objc2 家族 / image 0.25.10 由 reqwest 等间接带入),这里只是提升为
# 直接依赖以便按名导入;版本与 Cargo.lock 既有条目完全一致,不引入新包。
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-dialog = "2"
# R7 Task 5：把参考帧 JPEG 编成 data URI 喂给 MiniMax。0.22.1 已经是
# Cargo.lock 里锁定的传递版本(reqwest 等间接依赖带入),这里只是把它提升为
# 直接依赖,不引入新版本、不动锁文件里其它包。
base64 = "=0.23.1"
# 应用内自动更新(R6 Task 1)。=2.11.0 是与 tauri =2.11.5 兼容的最新版
# (2.10+ 要求 tauri ^2.10);process 用于更新装好后重启进程(=2.3.1 要求 tauri ^2.8.2)。
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.11.0"
axum = { version = "=0.8.9", features = ["http1", "tokio"] }
blake3 = "=1.8.7"
# R10 U-24:导入 Whisper 模型文件前校验 SHA-256(官方 Hugging Face LFS 的 oid 就是
# SHA-256)。=0.10.9 已经是 Cargo.lock 里锁定的传递版本,这里只是提升为直接依赖。
sha2 = "0.11"
libc = "=0.2.189"
libmpv2 = "=6.0.0"
lopdf = "=0.44.0"
objc2 = "=0.6.4"
# block2 pinned alongside objc2/objc2-foundation: R6 Task 4 睡眠唤醒订阅用
# `NSNotificationCenter addObserverForName:object:queue:usingBlock:`,该
# selector 的 usingBlock 参数是一个 Objective-C block,由 block2::RcBlock
# 从闭包构造。已经是 objc2-foundation 的可选依赖(见下面 "block2" feature),
# 这里显式声明成直接依赖,便于在 lib.rs 里直接 `use block2::RcBlock`。
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = [
    "objc2-core-foundation",
    "NSNotification",
    "NSOperation",
    # R16 车道 E:`NSProcessInfo.thermalState` 散热三档退避(core/thermal.rs);同一 crate 加一个 feature,不引新依赖。
    "NSProcessInfo",
    "NSString",
    "block2",
] }
objc2-app-kit = { version = "=0.3.2", features = [
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSGraphics",
    "NSOpenGL",
    "NSOpenGLView",
    "NSWorkspace",
] }
# R4 Task 2 联系表 PDF。既非 brief 举例的 0.7.x 也非 0.8.x——详见
# core/contact_sheet.rs 头部注释,这里只记结论:0.7.0 的字体嵌入路径硬编码
# FontFile2/CIDFontType2(TrueType glyf 专属组合),对我们 CFF 内核的
# SourceHanSansSC OTF 子集不生成 ToUnicode CMap(实测 lopdf::Document::
# extract_text 只吐乱码,poppler 全靠自己探测内嵌 cmap 兜底,不可依赖);0.8.2
# 用 allsorts-subset-browser 正确识别 CFF、正确写出 ToUnicode bfchar CMap,但
# 它绑定的 lopdf ^0.35.0 命中 RUSTSEC-2026-0187(栈溢出,7.5/high),cargo
# audit 会拦。0.11.0 起 printpdf 把内部 lopdf 换成 ^0.44.0(已修复该漏洞),
# 代价是 Op 枚举改了字段形状(SetFontSize/WriteText{font,..} 变成
# SetFont{font:PdfFontHandle,..}/ShowText{items});0.12.8 是写这段注释时最新
# 且未被 yank 的版本。default-features=false 关掉默认的 html(→ text_layout/
# azul-*/resvg/usvg/svg2pdf/rust-fontconfig/kuchiki)——本任务不渲染 HTML/SVG,
# 只需 jpeg 解码 + 字体/文本 Op。
printpdf = { version = "=0.12.8", default-features = false, features = ["jpeg"] }
rfd = "=0.17.2"
# R7 Task 4：MiniMax v2 视频生成客户端。=0.13.4 是 Cargo.lock 已锁定的版本；
# default-features=false 关掉默认 TLS 后端(openssl),用 rustls 避免系统 OpenSSL
# 依赖；blocking 给出同步包装。曾经还开了 "stream"(给 download() 边下边写用
# reqwest 的异步字节流适配器),但安全修复批次把 download() 改成 blocking
# Read + 后台线程 + mpsc 逐块卡死检测(见 core/minimax.rs 的
# `download`/`TempFileGuard`),不再调用 bytes_stream/wrap_stream——全仓
# grep 确认没有别处用到,已去掉这个 feature。
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
# R7 Task 4：Retry-After 头的 RFC 1123 HTTP-date 形式解析。已经是
# hyper 的传递依赖(Cargo.lock 锁定 1.0.3),这里显式声明成直接依赖才能在
# core/minimax.rs 里 `use httpdate::parse_http_date`。
httpdate = "=1.0.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# R5 Task 1 音乐节拍分析：纯 Rust FFT，无 C 依赖、无 RUSTSEC 通告。
rustfft = "=6.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
# R18 M-03:让 123 个 tracing 调用点真的落盘。只开 fmt + ansi 之外的最小特性集——
# 不开 env-filter(它会拉 regex),级别用 TRIPCUT_LOG 自己解析成 LevelFilter。
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "=0.2.3"
ttf-parser = "=0.25.1"
# 已是 tauri/updater 的传递依赖(Cargo.lock 锁定 2.5.8);updater.rs 直接用
# url::Url 解析回环覆盖端点(M1 review 修复),不能只靠传递依赖的隐式版本。
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["v4"] }
walkdir = "=2.5.0"
tauri-plugin-notification = "=2.4.0"
# R18 H-16:通知上的「在 Finder 中显示」。tauri-plugin-notification 的桌面
# builder 只暴露 title/body/icon/sound,动作按钮拿不到;插件自己用的就是这个
# crate(Cargo.lock 早已锁定 4.18.0,这里只是把传递依赖写成直接依赖,
# 与上面 tauri-plugin-updater / url 同一个理由)。default-features 关掉:
# 默认的 `z`(zbus)只服务 Linux,macOS 一行都用不上。
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "=4.18.0", default-features = false }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

# 上游 libmpv2 6.0.0 的 RenderContext Drop 存在回调释放竞态(vo 线程 SIGSEGV),
# vendor 版先解除 mpv 侧回调再 free;上游修复后可移除。
[patch.crates-io]
libmpv2 = { path = "../vendor/libmpv2" }

# R18 车道 native / M-09:默认 release 不 strip、不 LTO、codegen-units=16——
# 主二进制里有 6 万个符号、__LINKEDIT 段 8 MB(brainstorm-holistic §1.10 实测)。
# panic = "abort" **不能**用:player/mod.rs 与 contact_sheet.rs 有 5 处 catch_unwind。
# strip = "symbols" 不影响崩溃日志的可读性:doctor.rs 写的是 PanicHookInfo
# (文件:行号来自 panic location,不依赖符号表)。
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
